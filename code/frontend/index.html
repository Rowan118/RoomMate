<!doctype html>
<html lang="en">
  <!-- account creation for RoomMate -->
  <head>
    <meta charset="utf-8">
    <title>account_login</title>
  </head>
  <body>
    <h1>Login</h1>
    <p>Enter your current WSU email and a secure password to create an account</p>
    
    <div id="loginForm">
        <label for="email">Email:</label><br>
        <input type="email" id="email"><br><br>
        <label for="password">Password:</label><br>
        <input type="password" id="password" ><br><br>
        <button type="button" id="submit">Log In</button>
    </div>

    <p id="error" style="color: red;"></p>

    <script src="get_password.js"></script>

    <p>Don't have an account? Click 
      <a href="https://rowan118.github.io/RoomMate/code/frontend/new_account.html">
        here
      </a>
      to sign up!
    </p>

  </body>
</html>
